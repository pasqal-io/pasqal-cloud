name: Publish pasqal-cloud 📦 to PyPI and TestPyPI

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      # Before checkout so git trusts the fixed store, see https://emudhra.we-have-a-problem.com/
      # (apt verifies packages with GPG-signed indexes, not TLS).
      - &upgrade-ca-certificates
        name: Upgrade ca-certificates
        run: sudo apt-get update && sudo apt-get install -y --only-upgrade ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches VERSION.txt
        run: |
          # strips refs/tags/ prefix from GITHUB_REF
          tag="${GITHUB_REF#refs/tags/}"
          version=$(cat VERSION.txt)
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match VERSION.txt '$version'"
            exit 1
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Upgrade pip and certifi
        run: |
          # Pinned pip >= 26.2.2 for the eMudhra/emSign CA incident, see https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade pip certifi

      - name: Install pypa/build
        run: >-
          python -m
          pip install
          build
          --user

      - name: Build the binary wheels and source tarballs
        shell: bash
        run: ./.github/scripts/package.sh

      - name: Publish distribution 📦 to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Allows repeating the action
          attestations: false # Otherwise an attestation is added to dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-n-publish
    permissions:
      contents: write # required to create the GitHub release
    steps:
      - *upgrade-ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from VERSION.txt
        id: get_version
        run: |
          version=$(cat VERSION.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Get release notes from CHANGELOG.md
        run: |
          version="$VERSION"
          # Extract notes from changelog
          notes=$(awk -v ver="$version" '
              BEGIN { found_version=0; leading_blank=1; }
              /## \[/ { if (found_version) { exit } }
              /## \['"$version"'\]/ {
                  found_version=1;
                  next
              }
              found_version {
                  # Remove the _released line
                  if ($0 ~ /^_released/) { next }

                  # Remove leading ### or ## or # and any additional whitespace
                  gsub(/^#+ +/, "", $0);

                  # Check if the line is blank
                  if ($0 != "") {
                      print $0;  # Print the current line
                      leading_blank=0;  # Reset leading blank flag
                  } else if (!leading_blank) {
                      print "";  # Print a blank line for subsequent empty lines
                  }
              }
          ' CHANGELOG.md)
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Display release notes
        run: echo "$RELEASE_NOTES"

      - name: Create GitHub Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: ${{ env.VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
