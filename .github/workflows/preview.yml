# .github/workflows/preview.yml
name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# `pull_request` (never `pull_request_target`) is deliberate: the build below
# executes code from the pull request, so it must not run in a context that has
# access to repository secrets or a writable token.
permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  # Deploys push to gh-pages; cancelling one midway can leave it inconsistent.
  cancel-in-progress: false

jobs:
  # UNTRUSTED. Builds the pull request's own code: `pip install .[docs]` runs
  # its packaging code, and mkdocs.yml enables `markdown_exec`, which executes
  # Python from the docs at build time. This job therefore holds no permissions
  # and no credentials -- it only produces an artifact.
  build:
    name: Build docs
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; deliberately nothing else
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: doc-publish-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            doc-publish-

      - run: pip install .[docs]
        working-directory: pasqal-cloud

      - run: mkdocs build

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-site
          path: ./site/
          retention-days: 1

  # TRUSTED. Holds the write token but never runs code from the pull request:
  # it checks out the base commit and only unpacks the artifact built above.
  deploy:
    name: Deploy preview
    needs: [build]
    # Forks get a read-only token no matter what `permissions` says, so a
    # deploy from one cannot succeed. Skip it rather than fail the PR; the
    # build job above still validates that a fork's docs compile.
    if: |
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the preview to the gh-pages branch
      pull-requests: write # leave/update the sticky preview comment
    steps:
      - name: Checkout the base commit, never the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Download built site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview-site
          path: ./site/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          qr-code: false

  portal-preview:
    name: Deploy doc-portal preview
    needs: [deploy]
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish under portal-preview/pr-<n>/ on gh-pages
      pull-requests: write # sticky comment
    env:
      PORTAL_PREVIEW_PATH: portal-preview/pr-${{ github.event.pull_request.number }}
      DOC_PORTAL_IMAGE: europe-west9-docker.pkg.dev/pasqal-artifact/frontend/doc-portal:source-runtime
    steps:
      - name: Checkout the base commit, never the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west9-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_ARTIFACT_REGISTRY_SA }}

      - name: Pull the doc portal image
        run: docker pull "$DOC_PORTAL_IMAGE"

      - name: Wait for GitHub Pages # Maybe later: poll with curl until the mkdocs preview URL responds.
        run: sleep 60

      - name: Build the portal preview
        run: |
          mkdir -p portal-dist
          docker run --rm \
            --volume "$PWD/portal-dist:/out" \
            --env BUILD_CONFIG='{"pasqalCloud":"https://pasqal-io.github.io/pasqal-cloud/pr-preview/pr-${{ github.event.pull_request.number }}/"}' \
            --env ASTRO_BASE="/pasqal-cloud/${PORTAL_PREVIEW_PATH}/" \
            --entrypoint sh \
            "$DOC_PORTAL_IMAGE" \
            -c 'sh /app/docker/doc-portal-rebuild-source.sh pasqalCloud && cp -r /app/packages/doc-portal/dist/. /out/'

      - name: Publish to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: portal-dist
          branch: gh-pages
          target-folder: ${{ env.PORTAL_PREVIEW_PATH }}
          force: false
          commit-message: Doc portal preview for PR ${{ github.event.pull_request.number }}

      - name: Comment the preview link on the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: doc-portal-preview
          message: |
            Doc portal preview: https://pasqal-io.github.io/pasqal-cloud/${{ env.PORTAL_PREVIEW_PATH }}/cloud/pasqal-cloud/

            Built from ${{ github.event.pull_request.head.sha }}.
  portal-cleanup:
    name: Cleanup portal preview
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Remove the preview folder
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm -r --ignore-unmatch "portal-preview/pr-${{ github.event.pull_request.number }}"
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "Remove doc portal preview for PR ${{ github.event.pull_request.number }}"
          git push

      - name: Remove the preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: doc-portal-preview
          delete: true
