name: Verify if secrets were leaked

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by digest (v8.20.1, matching the rev pinned in .pre-commit-config.yaml)
  # so that a moved tag cannot silently change the code we execute.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:a83ee37c5eb2523689b15af8c645424c7eb1730541037e8ea805637d91372e85

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the base commit has to be present to diff against.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit range to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          have() { [ -n "${1:-}" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }

          if [ "$EVENT_NAME" = "pull_request" ] && have "$PR_BASE_SHA" && have "$PR_HEAD_SHA"; then
            # Only the commits this pull request adds on top of its base.
            log_opts="--no-merges $PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && have "$PUSH_BEFORE_SHA"; then
            log_opts="--no-merges $PUSH_BEFORE_SHA..$PUSH_AFTER_SHA"
          else
            # Branch creation, force push, or a range we cannot resolve: fall
            # back to a bounded window rather than rescanning all of history.
            log_opts="-50"
          fi

          echo "Scanning git log range: $log_opts"
          echo "log_opts=$log_opts" >> "$GITHUB_OUTPUT"

      - name: Scan commits for leaked secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git /repo \
              --redact \
              --no-banner \
              --exit-code 1 \
              --log-opts="$LOG_OPTS"
