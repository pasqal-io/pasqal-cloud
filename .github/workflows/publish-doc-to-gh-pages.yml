name: Publish MkDocs documentation to gh-pages
on:
  push:
    branches:
      - main
concurrency:
  group: gh-pages
  cancel-in-progress: false
  tags:
    - "*"
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - name: Verify tag matches VERSION.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # strips refs/tags/ prefix from GITHUB_REF
          tag="${GITHUB_REF#refs/tags/}"
          version=$(cat VERSION.txt)
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match VERSION.txt '$version'"
            exit 1
          fi
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: doc-publish-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            doc-publish-
      - run: pip install .[docs]
        working-directory: pasqal-cloud
      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1
      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases dev
      - name: Deploy versioned docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" = "$(git tag -l '[0-9]*' --sort=-v:refname | head -n1)" ]; then
            mike deploy --push --update-aliases "$tag" latest
            mike set-default --push latest
          else
            mike deploy --push "$tag"
          fi
