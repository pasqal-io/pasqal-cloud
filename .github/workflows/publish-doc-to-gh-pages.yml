name: Publish MkDocs documentation to gh-pages
on:
  push:
    branches:
      - main
    tags:
      - "*"
concurrency:
  group: gh-pages
  cancel-in-progress: false
permissions:
  contents: write
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Before checkout so git trusts the fixed store, see https://emudhra.we-have-a-problem.com/
      # (apt verifies packages with GPG-signed indexes, not TLS).
      - name: Upgrade ca-certificates
        run: sudo apt-get update && sudo apt-get install -y --only-upgrade ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - name: Verify tag matches VERSION.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # strips refs/tags/ prefix from GITHUB_REF
          tag="${GITHUB_REF#refs/tags/}"
          version=$(cat VERSION.txt)
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match VERSION.txt '$version'"
            exit 1
          fi
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Upgrade pip and certifi
        run: |
          # Pinned pip >= 26.2.2 for the eMudhra/emSign CA incident, see https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade pip certifi
      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: doc-publish-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            doc-publish-
      - run: pip install .[docs]
        working-directory: pasqal-cloud
      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1
      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases dev
      - name: Deploy versioned docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" = "$(git tag -l '[0-9]*' --sort=-v:refname | head -n1)" ]; then
            mike deploy --push --update-aliases "$tag" latest
            mike set-default --push latest
          else
            mike deploy --push "$tag"
          fi
